<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Analog Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clock-container">
        <div class="clock">
            <!-- Clock Face Markers -->
            <div class="marker marker-12"></div>
            <div class="marker marker-1"></div>
            <div class="marker marker-2"></div>
            <div class="marker marker-3"></div>
            <div class="marker marker-4"></div>
            <div class="marker marker-5"></div>
            <div class="marker marker-6"></div>
            <div class="marker marker-7"></div>
            <div class="marker marker-8"></div>
            <div class="marker marker-9"></div>
            <div class="marker marker-10"></div>
            <div class="marker marker-11"></div>

            <!-- Hour Numbers -->
            <span class="number num-12">12</span>
            <span class="number num-1">1</span>
            <span class="number num-2">2</span>
            <span class="number num-3">3</span>
            <span class="number num-4">4</span>
            <span class="number num-5">5</span>
            <span class="number num-6">6</span>
            <span class="number num-7">7</span>
            <span class="number num-8">8</span>
            <span class="number num-9">9</span>
            <span class="number num-10">10</span>
            <span class="number num-11">11</span>

            <!-- Clock Hands -->
            <div class="hand hour-hand" id="hour-hand"></div>
            <div class="hand minute-hand" id="minute-hand"></div>
            <div class="hand second-hand" id="second-hand"></div>
            
            <!-- Center Pivot -->
            <div class="center-pivot"></div>
        </div>

        <div class="digital-display" id="digital-display">00:00:00 AM</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
